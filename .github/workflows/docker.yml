name: Docker smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the image
        run: |
          docker build -t iris-api .
          docker run --detach --name iris-api -p 127.0.0.1:8000:8000 iris-api
      - name: Check health, a prediction, and invalid input
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 4 \
            http://127.0.0.1:8000/health | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent --show-error http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"sepal_length_cm":5.1,"sepal_width_cm":3.5,"petal_length_cm":1.4,"petal_width_cm":0.2}' \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"species": "setosa"}'
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/predict -H 'Content-Type: application/json' -d '{"sepal_length_cm":5.1}')
          test "$status" = 400
      - name: Show container logs on failure
        if: failure()
        run: docker logs iris-api || true
